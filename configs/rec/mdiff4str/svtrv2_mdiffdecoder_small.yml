# model_key: short identifier used by run_*.sh to compose Global.output_dir as
#   ./output/rec/<DATA_KEY>/<model_key>/  (DATA_KEY derived from --data alias)
# Inherited by all variant configs (pretrain/finetune/short) via _BASE_.
model_key: mdiff-s

Global:
  device: gpu
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 10
  # output_dir: auto-composed from --data + model_key by run_*.sh (see Global.output_dir override)
  save_epoch_step: [99999, 1]  # disabled: epoch_N.pth not saved (latest.pth + best.pth만 사용)
  # evaluation is run every 2000 iterations
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  use_wandb: true
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt # 96en
  # ./tools/utils/ppocr_keys_v1.txt  # ch
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  use_amp: True
  grad_clip_val: 20.0
  # total_bs 설정 시 world_size로 나눠 per-card bs 자동 산출 (Train.loader/sampler 둘 다 override).
  # 비워두면 아래 first_bs 값 그대로 per-card bs로 사용.
  total_bs: 512

Optimizer:
  name: AdamW
  # lr: 5.0e-4 # for 8gpus bs128/gpu
  lr: 2.5e-4 # bs=512에 대해 bs=1024 대비 1/2로 lr 감소
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5 # pct_start 0.075*20 = 1.5ep
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: MDiff4STR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [3, 6, 3]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv'],['Conv','Conv','Conv','FGlobal','Global','Global'],['Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: False
  Decoder:
    name: MDiffDecoder
    num_decoder_layers: 3
    nhead: 6
    max_len: *max_text_length
    parallel_decoding: False
    autoregressive_decoding: False
    low_confidence_decoding: False
    random_mask_decoding: False
    semi_autoregressive_decoding: True
    cloze_mask_decoding: False
    sampler_step: 3
    sample_k: &sample_k 3
    temperature: 1.0

Loss:
  name: MDiffLoss

PostProcess:
  name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: True

Train:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: false
    data_dir_list: [
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_challenging',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_hard',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_medium',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_normal',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_easy',
    ]
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - MDiffLabelEncode: # Class handling label
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          sample_num: *sample_k
          train_all_layer: True
      - KeepKeys:
          keep_keys: ['image', 'label', 'reflect_ids', 'noisy_batch', 'masked_indices', 'p_mask', 'length'] # dataloader will return list in this order
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    # divide_factor: to ensure the width and height dimensions can be devided by downsampling multiple
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 4
    num_workers: 8

Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: [
      '~/data/STR/openocr/evaluation/CUTE80',
      '~/data/STR/openocr/evaluation/IC13_857',
      '~/data/STR/openocr/evaluation/IC15_1811',
      '~/data/STR/openocr/evaluation/IIIT5k',
      '~/data/STR/openocr/evaluation/SVT',
      '~/data/STR/openocr/evaluation/SVTP',
      ]
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - ARLabelEncode: # Class handling label
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # dataloader will return list in this order
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    # divide_factor: to ensure the width and height dimensions can be devided by downsampling multiple
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 4
